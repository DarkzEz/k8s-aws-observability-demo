# AWS EKS: image comes from ECR. CI rewrites newName/newTag with `kustomize edit set image`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: status-api
    newName: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/status-api
    newTag: latest

patches:
  - path: service-loadbalancer.yaml
