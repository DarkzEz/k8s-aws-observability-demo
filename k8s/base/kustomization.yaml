apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: status-api

labels:
  - pairs:
      app.kubernetes.io/part-of: status-api
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
