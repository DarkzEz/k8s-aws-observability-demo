# Requires metrics-server (installed by `make metrics-server`).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: status-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: status-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
